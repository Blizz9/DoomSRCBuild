[sdl]
output = surface

[cpu]
cycles = fixed 50000

[autoexec]
mount c /dos
C:

if exist "C:\SKIPINST.FLG" goto BUILD

echo "DOS Environment | Mounting Watcom C++ 9.5 diskettes" >> C:\STDOUT.LOG
imgmount a /img/watcom/W9532_01.img /img/watcom/W9532_02.img /img/watcom/W9532_03.img /img/watcom/W9532_04.img /img/watcom/W9532_05.img /img/watcom/W9532_06.img /img/watcom/W9532_07.img /img/watcom/W9532_08.img /img/watcom/W9532_09.img -t floppy
A:

echo "DOS Environment | Installing Watcom C++ 9.5 via automation" >> C:\STDOUT.LOG
autotype -w 3 -p .5 enter enter y enter y enter y enter y enter n enter n enter y enter n enter n enter y enter n enter n enter n enter n enter n enter n enter n enter n enter n enter
INSTALL.EXE
echo "DOS Environment | Watcom C++ 9.5 installation complete" >> C:\STDOUT.LOG

echo "DOS Environment | Mounting Borland C++ 3.1 diskettes" >> C:\STDOUT.LOG
imgmount -u a
imgmount a /img/borland/Disk01.img /img/borland/Disk02.img /img/borland/Disk03.img /img/borland/Disk04.img /img/borland/Disk05.img /img/borland/Disk06.img /img/borland/Disk07.img /img/borland/Disk08.img /img/borland/Disk09.img /img/borland/Disk10.img /img/borland/Disk11.img /img/borland/Disk12.img /img/borland/Disk13.img /img/borland/Disk14.img /img/borland/Disk15.img -t floppy
A:

echo "DOS Environment | Installing TASM (from Borland C++ 3.1) via automation" >> C:\STDOUT.LOG
autotype -w 3 -p .5 enter enter down down enter enter down enter down enter down down enter down enter down enter down enter down enter esc down enter enter down enter down enter down enter down enter down enter down enter down enter esc down enter enter down enter down enter down enter down enter down enter esc down enter enter down enter down enter down enter down enter down enter esc down enter
INSTALL.EXE
echo "DOS Environment | TASM (from Borland C++ 3.1) installation complete" >> C:\STDOUT.LOG

C:
imgmount -u a

echo "DOS Environment | Patching Watcom C++ 9.5 to 9.5a" >> C:\STDOUT.LOG
CD C:\WTCMPTCH\A
CALL APPLYA.BAT C:\WATCOM -p

echo "DOS Environment | Installing Doom v1.0 (shareware) via automation" >> C:\STDOUT.LOG
CD C:\DOOM10
autotype -w 3 -p .5 c left delete 1 9 enter
autotype -w 16 -p .5 esc esc esc esc enter
CALL INSTALL.BAT
echo "DOS Environment | Doom v1.0 (shareware) installation complete" >> C:\STDOUT.LOG

:BUILD

echo "DOS Environment | Building Doom v1.0" >> C:\STDOUT.LOG
CD C:\SRC
MKDIR DM10
CALL BDDM10.BAT

C:\DOS32A\BINW\SB /u C:\DOOM10\DOOM.EXE
C:\DOS32A\BINW\SB /u C:\SRC\DM10\STRPDOOM.EXE

echo "DOS Environment | Doom v1.0 build is complete!!!" >> C:\STDOUT.LOG
